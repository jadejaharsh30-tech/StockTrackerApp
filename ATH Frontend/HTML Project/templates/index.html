<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EquiTrend | ATH Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <nav class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fa-solid fa-chart-line text-blue-600 text-2xl mr-3"></i>
                    <span class="font-bold text-xl tracking-tight text-slate-900">EquiTrend <span class="text-blue-600">ATH Monitor</span></span>
                </div>
                <div class="flex items-center text-sm text-slate-500">
                    System Status: <span class="ml-2 px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold">ONLINE</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
                <div class="text-slate-500 text-sm font-medium uppercase tracking-wider">Total Stocks</div>
                <div class="text-3xl font-bold text-slate-900 mt-2">{{ stats.total }}</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
                <div class="text-slate-500 text-sm font-medium uppercase tracking-wider">NSE Listed</div>
                <div class="text-3xl font-bold text-indigo-600 mt-2">{{ stats.nse }}</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
                <div class="text-slate-500 text-sm font-medium uppercase tracking-wider">BSE Listed</div>
                <div class="text-3xl font-bold text-orange-600 mt-2">{{ stats.bse }}</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
                <div class="text-slate-500 text-sm font-medium uppercase tracking-wider">Last Update</div>
                <div class="text-lg font-bold text-slate-700 mt-2 truncate">{{ stats.last_update }}</div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden mb-10">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-slate-800">Scanner Operations</h3>
            </div>
            <div class="p-8">
                <div class="flex gap-6">
                    <button onclick="runScan('daily')" id="btn-daily" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-6 rounded-lg shadow transition duration-200 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-bolt"></i> Run Daily Scan (Fast)
                    </button>
                    <button onclick="runScan('weekly')" id="btn-weekly" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-4 px-6 rounded-lg shadow transition duration-200 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-rotate"></i> Run Weekend Refresh
                    </button>
                </div>
                
                <div class="mt-8">
                    <label class="block text-sm font-medium text-slate-500 mb-2">System Logs</label>
                    <div id="terminal" class="bg-slate-900 text-green-400 font-mono text-sm p-4 rounded-lg h-48 overflow-y-auto whitespace-pre-wrap">Waiting for command...</div>
                </div>
            </div>
        </div>

        <div id="results-area" class="hidden">
            <h3 class="text-2xl font-bold text-slate-900 mb-6 flex items-center">
                <i class="fa-solid fa-trophy text-yellow-500 mr-3"></i> Today's New All-Time Highs
            </h3>
            <div class="bg-white rounded-lg shadow overflow-hidden border border-slate-200">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Symbol</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Previous ATH</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">New ATH Price</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody id="results-body" class="bg-white divide-y divide-slate-200">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function runScan(type) {
            const terminal = document.getElementById('terminal');
            const btnDaily = document.getElementById('btn-daily');
            const btnWeekly = document.getElementById('btn-weekly');
            const resultsArea = document.getElementById('results-area');
            
            // UI State: Running
            terminal.innerText = "Initializing process... please wait.\n";
            btnDaily.disabled = true;
            btnWeekly.disabled = true;
            btnDaily.classList.add('opacity-50', 'cursor-not-allowed');
            btnWeekly.classList.add('opacity-50', 'cursor-not-allowed');

            const endpoint = type === 'daily' ? '/run-daily' : '/run-weekly';

            try {
                const response = await fetch(endpoint);
                const data = await response.json();

                // Update Terminal with backend logs
                terminal.innerText = data.log || "Process finished with no output.";

                if (data.status === 'success') {
                    // If it was a daily scan and we have results
                    if (type === 'daily' && data.new_aths && data.new_aths.length > 0) {
                        renderResults(data.new_aths);
                        resultsArea.classList.remove('hidden');
                    } else if (type === 'daily') {
                         terminal.innerText += "\n[INFO] No new ATHs found today.";
                         resultsArea.classList.add('hidden');
                    }
                } else {
                    terminal.innerText += "\n[ERROR] Something went wrong.";
                }

            } catch (error) {
                terminal.innerText += `\n[CRITICAL ERROR] Failed to connect to server: ${error}`;
            } finally {
                // UI State: Reset
                btnDaily.disabled = false;
                btnWeekly.disabled = false;
                btnDaily.classList.remove('opacity-50', 'cursor-not-allowed');
                btnWeekly.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function renderResults(items) {
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';
            
            items.forEach(item => {
                const row = `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-900">${item.Symbol}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">₹${item['Previous ATH'].toFixed(2)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-green-600">₹${item['New ATH Price'].toFixed(2)}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">New Record</span>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }
    </script>
</body>
</html>
