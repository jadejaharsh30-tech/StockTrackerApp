<div class="card glass-card stagger-fade-in delay-{{ loop_index % 10 + 1 }}"
    style="padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 100%; transition: transform 0.2s;">
    <div style="padding: 1.5em; flex-grow: 1;">
        <div
            style="font-size: 0.8em; color: var(--accent-color); font-weight: 600; text-transform: uppercase; margin-bottom: 0.5em;">
            {{ news.source }}
        </div>
        <h3 style="font-size: 1.1em; margin-bottom: 0.8em; line-height: 1.4;">
            <a href="{{ news.link }}" target="_blank" style="text-decoration: none; color: var(--primary-color);">
                {{ news.title }}
            </a>
        </h3>
        <div style="font-size: 0.85em; color: var(--secondary-color); opacity: 0.8;">
            {{ news.published }}
        </div>
    </div>
    <div
        style="padding: 1em 1.5em; background: rgba(0,0,0,0.02); border-top: 1px solid var(--glass-border); text-align: right;">
        <a href="{{ news.link }}" target="_blank"
            style="text-decoration: none; color: var(--info-color); font-weight: 500; font-size: 0.9em;">
            Read Full Story →
        </a>
    </div>
</div>
